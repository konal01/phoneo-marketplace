              "on-surface": "#0b1c30",

              "surface-dim": "#cbdbf5",

    <style>
      @layer base {
        html, body {
          margin: 0;
          padding: 0;
          background-color: #f8f9ff;
          font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .pb-safe {
          padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        .pt-safe {
          padding-top: env(safe-area-inset-top, 0px);
        }
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .material-symbols-outlined.filled {
        font-variation-settings: 'FILL' 1;
      }
      @keyframes logoPulse {
        0%, 100% {
          transform: scale(1);
          filter: drop-shadow(0 0 20px rgba(0, 196, 180, 0.35));
        }
        50% {
          transform: scale(1.04);
          filter: drop-shadow(0 0 35px rgba(0, 196, 180, 0.65));
        }
      }
      @keyframes loadProgress {
        0% {
          width: 0%;
        }
        50% {
          width: 70%;
        }
        100% {
          width: 100%;
        }
      }
      .animate-logo-pulse {
        animation: logoPulse 1.25s ease-in-out infinite;
      }
      .animate-load-progress {
        animation: loadProgress 1.05s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }
    </style>
  </head>
  <body class="bg-background font-body-md text-body-md text-on-surface antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
