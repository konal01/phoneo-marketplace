    <style>
      @layer base {
        html, body {
          margin: 0;
          padding: 0;
          background-color: #f8fafc;
          font-family: 'Plus Jakarta Sans', sans-serif;
          color: #0f172a;
        }
        .pb-safe {
          padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        .pt-safe {
          padding-top: env(safe-area-inset-top, 0px);
        }
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .material-symbols-outlined.filled {
        font-variation-settings: 'FILL' 1;
      }
      @keyframes logoPulse {
        0%, 100% {
          transform: scale(1);
          filter: drop-shadow(0 0 20px rgba(13, 148, 136, 0.35));
        }
        50% {
          transform: scale(1.04);
          filter: drop-shadow(0 0 32px rgba(20, 184, 166, 0.6));
        }
      }
      @keyframes loadProgress {
        0% {
          width: 0%;
        }
        50% {
          width: 70%;
        }
        100% {
          width: 100%;
        }
      }
      @keyframes subtleCardFloat {
        0%, 100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-3px);
        }
      }
      @keyframes softShimmer {
        0% {
          background-position: -200% 0;
        }
        100% {
          background-position: 200% 0;
        }
      }
      .animate-logo-pulse {
        animation: logoPulse 1.25s ease-in-out infinite;
      }
      .animate-load-progress {
        animation: loadProgress 1.05s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }
      .animate-card-float {
        animation: subtleCardFloat 4s ease-in-out infinite;
      }

      /* Noticeable Glassmorphic Card Classes with Gradients & Specular Bevels */
      .phone-card-glass {
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.88) 0%, rgba(255, 255, 255, 0.72) 60%, rgba(240, 253, 250, 0.65) 100%);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(204, 251, 241, 0.9);
        box-shadow: 0 12px 32px -4px rgba(13, 148, 136, 0.14), 0 4px 12px rgba(0, 0, 0, 0.03), inset 0 1px 2px rgba(255, 255, 255, 1);
        transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .phone-card-glass:hover {
        transform: translateY(-5px);
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0.82) 50%, rgba(230, 255, 250, 0.8) 100%);
        border-color: rgba(45, 212, 191, 0.95);
        box-shadow: 0 22px 48px -6px rgba(13, 148, 136, 0.26), 0 6px 16px rgba(0, 0, 0, 0.04), inset 0 1px 2px rgba(255, 255, 255, 1);
      }
      .glass-panel {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0.68) 100%);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(204, 251, 241, 0.85);
        box-shadow: 0 12px 36px -4px rgba(13, 148, 136, 0.12), inset 0 1px 2px rgba(255, 255, 255, 1);
      }
      .glass-panel-teal {
        background: linear-gradient(135deg, rgba(240, 253, 250, 0.85) 0%, rgba(204, 251, 241, 0.65) 100%);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(94, 234, 212, 0.7);
        box-shadow: 0 12px 36px -4px rgba(13, 148, 136, 0.16), inset 0 1px 2px rgba(255, 255, 255, 1);
      }
    </style>
  </head>
  <body class="bg-gradient-to-br from-teal-50/50 via-slate-50/60 to-cyan-50/40 font-body-md text-body-md text-on-surface antialiased min-h-screen relative overflow-x-hidden selection:bg-teal-500 selection:text-white">
    <!-- Ambient Gradient Mesh Blooms for Glassmorphism Refraction -->
    <div class="fixed inset-0 pointer-events-none z-[-1] overflow-hidden" aria-hidden="true">
      <div class="absolute -top-40 -right-40 w-[32rem] h-[32rem] rounded-full bg-gradient-to-br from-teal-300/30 via-emerald-200/20 to-transparent blur-3xl animate-pulse" style="animation-duration: 9s;"></div>
      <div class="absolute top-1/4 -left-40 w-[36rem] h-[36rem] rounded-full bg-gradient-to-tr from-cyan-300/25 via-teal-200/20 to-transparent blur-3xl"></div>
      <div class="absolute top-2/3 right-5 w-[30rem] h-[30rem] rounded-full bg-gradient-to-tl from-teal-400/20 via-emerald-300/15 to-transparent blur-3xl"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
